# Keep the GitHub Actions the workflows use up to date: they're pinned by
# commit, so their versions only change through these pull requests.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # A new release waits a week before it's proposed, so that a compromised
    # one has time to be found and pulled first.
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
