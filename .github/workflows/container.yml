# Publish the `probl` command as a container image, ghcr.io/garlab/probl,
# for linux/amd64 and linux/arm64, from each version tag. The workflow's own
# token pushes it to GitHub's registry: no password is stored. Each image is
# tested before it's pushed, and the published one gets a provenance
# attestation (`gh attestation verify oci://ghcr.io/garlab/probl:0.2.0 -R
# garlab/probl`).
#
# A pull request that changes the image builds and tests it, without
# pushing. To publish a tag that's already pushed, or to rebuild one after a
# base image update, run this workflow by hand with the tag.
#
# With the repository variable DOCKERHUB_IMAGE (like `garlab/probl`), the
# variable DOCKERHUB_USERNAME and the secret DOCKERHUB_TOKEN, the image is
# copied to Docker Hub too.
name: Container

on:
  push:
    tags: ["v*"]
  pull_request:
    paths: [Dockerfile, .dockerignore, .github/workflows/container.yml]
  workflow_dispatch:
    inputs:
      tag:
        description: "The version tag to publish, like v0.2.0"
        required: true
      latest:
        description: "Also tag it `latest` (for the newest version only)"
        type: boolean
        default: true

# Nothing by default: each job asks for what it needs.
permissions: {}

concurrency:
  group: container-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/garlab/probl
  # The tag to publish: the one pushed, or the one asked for.
  TAG: ${{ inputs.tag || github.ref_name }}
  PUBLISH: ${{ github.event_name != 'pull_request' }}

jobs:
  # Each platform on a runner of its own architecture: no emulation.
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref }}
          persist-credentials: false
      - name: The tag is the version
        if: env.PUBLISH == 'true'
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::the tag is $TAG, but the version in Cargo.toml is $version"
            exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=probl
            org.opencontainers.image.description=The probl command: a programming language for probabilities, simulations and forecasts
            org.opencontainers.image.licenses=MIT OR Apache-2.0
      # Built once to test it, then pushed from the cache.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          tags: probl:test
          # Attestations are for the pushed image; this one is loaded.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Test
        run: |
          version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          test "$(docker run --rm probl:test --version)" = "probl $version"
          docker run --rm -v "$PWD":/work probl:test run examples/02_craps.probl --fractions
          docker run --rm -v "$PWD":/work probl:test run examples/08_signup_forecast.probl --today 2026-09-29
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Pushed by its digest only: the next job tags the platforms together.
      - name: Push
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          provenance: mode=max
          sbom: true
      - name: Keep the digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: digests-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # The platforms under the version's tags, and the provenance attestation.
  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # 0.2.0 and 0.2, and `latest` for a pushed tag or when asked.
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' || inputs.latest }}
      - name: Tag the platforms together
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ join(fromJSON(steps.meta.outputs.json).tags, ' ') }}
        run: |
          args=()
          for tag in $TAGS; do args+=(--tag "$tag"); done
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}" \
            --annotation "index:org.opencontainers.image.title=probl" \
            --annotation "index:org.opencontainers.image.description=The probl command: a programming language for probabilities, simulations and forecasts" \
            --annotation "index:org.opencontainers.image.source=https://github.com/garlab/probl" \
            --annotation "index:org.opencontainers.image.licenses=MIT OR Apache-2.0" \
            --annotation "index:org.opencontainers.image.version=${TAG#v}" \
            "${sources[@]}"
      - name: The image's digest
        id: index
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:${TAG#v}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - name: Test what was published
        run: docker run --rm "$IMAGE:${TAG#v}" --version
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: vars.DOCKERHUB_IMAGE != ''
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Copy to Docker Hub
        if: vars.DOCKERHUB_IMAGE != ''
        env:
          TAGS: ${{ join(fromJSON(steps.meta.outputs.json).tags, ' ') }}
          HUB: docker.io/${{ vars.DOCKERHUB_IMAGE }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          args=()
          for tag in $TAGS; do args+=(--tag "$HUB:${tag##*:}"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"
