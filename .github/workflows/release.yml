# Push a stable version tag to release. Dispatch on that tag with dry_run=true
# to validate without publishing. See docs/releases.md for the release process.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Test and package without publishing (select a version tag)
        type: boolean
        default: true

permissions: {}

# Serialise versions as well as retries, so older runs cannot move latest back.
concurrency:
  group: probl-release
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/garlab/probl
  TAG: ${{ github.ref_name }}
  PUBLISH: ${{ github.event_name == 'push' || !inputs.dry_run }}

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      # The key ci.yml's tests use: a release starts from main's cache, and
      # its pre-release's cache warms the release run.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tests
      - name: Validate release identity and ordering
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/release.py check "$TAG"
      - run: python3 -m unittest discover -s ci -p 'test_*.py'
      - run: cargo test --all --locked
      - run: cargo publish --workspace --dry-run --locked

  # On a runner of each architecture: no emulation.
  image:
    needs: verify
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=probl
            org.opencontainers.image.description=The probl command: a programming language for probabilities, simulations and forecasts
            org.opencontainers.image.licenses=MIT OR Apache-2.0
      # Built once to test, then pushed from the cache.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          tags: probl:test
          # A loaded image can't carry attestations.
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Test
        run: |
          test "$(docker run --rm probl:test --version)" = "probl ${TAG#v}"
          docker run --rm -v "$PWD":/work probl:test run examples/02_craps.probl --fractions
          docker run --rm -v "$PWD":/work probl:test run examples/08_signup_forecast.probl --today 2026-09-29
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # By digest only: the `container` job tags the platforms together.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: push
        if: env.PUBLISH == 'true'
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          provenance: mode=max
          sbom: true
      - if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: env.PUBLISH == 'true'
        with:
          name: digests-${{ matrix.runner }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  crates:
    if: github.event_name == 'push' || !inputs.dry_run
    needs: [verify, image]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      # `--no-verify`: `verify` built these packages from this commit, and
      # building them again here would run the dependencies' build scripts
      # and macros while the token is in the environment.
      - name: Publish the crates not on crates.io yet
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          metadata=$(cargo metadata --no-deps --format-version 1)
          version=$(jq -r '.packages[] | select(.name == "probl") | .version' <<< "$metadata")
          published=()
          remaining=0
          for name in $(jq -r '.packages[] | select(.publish != []) | .name' <<< "$metadata"); do
            if curl -sfo /dev/null -A "probl release (github.com/garlab/probl)" "https://crates.io/api/v1/crates/$name/$version"; then
              echo "$name $version is on crates.io already"
              published+=(--exclude "$name")
            else
              remaining=$((remaining + 1))
            fi
          done
          if [ "$remaining" -gt 0 ]; then
            cargo publish --workspace --locked --no-verify "${published[@]}"
          fi

  container:
    if: github.event_name == 'push' || !inputs.dry_run
    needs: [verify, image]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.TAG }}
            type=semver,pattern={{major}}.{{minor}},value=${{ env.TAG }}
            type=raw,value=latest
      - name: Tag the platforms together
        working-directory: ${{ runner.temp }}/digests
        env:
          TAGS: ${{ join(fromJSON(steps.meta.outputs.json).tags, ' ') }}
        run: |
          args=()
          for tag in $TAGS; do args+=(--tag "$tag"); done
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${args[@]}" \
            --annotation "index:org.opencontainers.image.title=probl" \
            --annotation "index:org.opencontainers.image.description=The probl command: a programming language for probabilities, simulations and forecasts" \
            --annotation "index:org.opencontainers.image.source=https://github.com/garlab/probl" \
            --annotation "index:org.opencontainers.image.licenses=MIT OR Apache-2.0" \
            --annotation "index:org.opencontainers.image.version=${TAG#v}" \
            "${sources[@]}"
      - id: index
        run: |
          digest=$(docker buildx imagetools inspect "$IMAGE:${TAG#v}" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.index.outputs.digest }}
          push-to-registry: true
      - run: docker run --rm "$IMAGE:${TAG#v}" --version
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: vars.DOCKERHUB_IMAGE != ''
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Copy to Docker Hub
        if: vars.DOCKERHUB_IMAGE != ''
        env:
          TAGS: ${{ join(fromJSON(steps.meta.outputs.json).tags, ' ') }}
          HUB: docker.io/${{ vars.DOCKERHUB_IMAGE }}
          DIGEST: ${{ steps.index.outputs.digest }}
        run: |
          args=()
          for tag in $TAGS; do args+=(--tag "$HUB:${tag##*:}"); done
          docker buildx imagetools create "${args[@]}" "$IMAGE@$DIGEST"

  source:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 ci/release.py archive "$TAG" "$RUNNER_TEMP/release"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: env.PUBLISH == 'true'
        with:
          subject-path: ${{ runner.temp }}/release/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: source-release
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: github.event_name == 'push' || !inputs.dry_run
    needs: [verify, source, crates, container]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: source-release
          path: ${{ runner.temp }}/release
      - name: Publish immutable release (identical retries are safe)
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/release.py publish "$TAG" "$RUNNER_TEMP/release"

  homebrew:
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions: {}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app
        with:
          app-id: ${{ vars.HOMEBREW_APP_ID }}
          private-key: ${{ secrets.HOMEBREW_APP_PRIVATE_KEY }}
          owner: garlab
          repositories: homebrew-tap
          permission-contents: write
      - name: Notify tap (the tap independently verifies the release)
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          jq -n --arg tag "$TAG" '{event_type: "probl-release", client_payload: {tag: $tag}}' |
            gh api repos/garlab/homebrew-tap/dispatches --input -
