# Independent crates.io releases. Dispatch on a grammar tag with dry_run=true
# to run all validation without requesting publishing credentials.
name: Grammar release

on:
  push:
    tags: ['tree-sitter-probl-v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: Test and package without publishing (select a grammar tag)
        type: boolean
        default: true

permissions: {}

concurrency:
  group: tree-sitter-probl-release
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  identity:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -m unittest discover -s ci -p 'test_*.py'
      - name: Validate the grammar tag and source commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ci/grammar_release.py check "$TAG"

  verify:
    needs: identity
    permissions:
      contents: read
    uses: ./.github/workflows/syntax-highlighting.yml

  publish:
    if: github.event_name == 'push' || !inputs.dry_run
    needs: [identity, verify]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: stable
      - name: Recheck the tag and detect an already-published retry
        id: registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(python3 ci/grammar_release.py check "$TAG")
          published=$(python3 ci/grammar_release.py published "$version")
          echo "published=$published" >> "$GITHUB_OUTPUT"
          if [ "$published" = true ]; then
            echo "tree-sitter-probl $version is on crates.io already; skipping publication."
          fi
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        if: steps.registry.outputs.published == 'false'
        id: auth
      # The reusable workflow built the package from this exact commit. Avoid
      # running dependency build scripts with the publishing token present.
      - name: Publish the grammar
        if: steps.registry.outputs.published == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --manifest-path editors/tree-sitter-probl/Cargo.toml --locked --no-verify --registry crates-io
