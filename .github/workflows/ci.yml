name: CI

on:
  push:
  pull_request:

# Read the repository, and nothing else.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Only `main` saves its cache: other branches and pull requests restore
      # it, but don't evict it with their own.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: tests
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: python3 -m unittest discover -s ci -p 'test_*.py'
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --all --locked

  # The playground: the WebAssembly build against the native one on every
  # example, then the page in headless Chrome (docs/playground.md).
  playground:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: playground
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: cargo test -p probl-wasm --locked
      # The browser test compares the page with the command's output.
      - run: cargo build --release --locked -p probl-cli
      - run: bun install --frozen-lockfile
        working-directory: web
      - run: bun run build
        working-directory: web
      # Ubuntu 24.04 keeps unprivileged programs from the user namespaces
      # that Chrome's sandbox needs; allow them, rather than turn it off.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: bun run test
        working-directory: web
        env:
          PROBL_CHROME: /usr/bin/google-chrome
