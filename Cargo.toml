[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/garlab/probl"

[workspace.dependencies]
probl-number = { path = "crates/probl-number", version = "=0.1.0" }
probl-syntax = { path = "crates/probl-syntax", version = "=0.1.0" }
probl-sema = { path = "crates/probl-sema", version = "=0.1.0" }
probl-engine = { path = "crates/probl-engine", version = "=0.1.0" }
probl = { path = "crates/probl", version = "=0.1.0" }
ariadne = "0.5"
rustc-hash = "2"
clap = { version = "4", features = ["derive"] }
insta = "1"
libtest-mimic = "0.8"
libm = "0.2"
csv = "1"
serde = "1"
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip", "raw_value", "arbitrary_precision"] }
sha2 = "0.10"
num-bigint = "0.4"
num-rational = { version = "0.4", default-features = false, features = ["num-bigint", "std"] }
num-traits = "0.2"

# The playground's WebAssembly build: small, and a panic ends the module
# (the playground reports it and starts a new one).
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
debug = 0
strip = true

[profile.dev.package."*"]
opt-level = 2

# The oracle enumerates every path with exact fractions, and the sampled
# examples run hundreds of thousands of times: their tests would be slow
# unoptimized.
[profile.dev.package.probl-oracle]
opt-level = 2

[profile.dev.package.probl-engine]
opt-level = 1

[profile.release]
debug = 1
