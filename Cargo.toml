[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
probl-syntax = { path = "crates/probl-syntax" }
probl-sema = { path = "crates/probl-sema" }
probl-engine = { path = "crates/probl-engine" }
ariadne = "0.5"
rustc-hash = "2"
clap = { version = "4", features = ["derive"] }
insta = "1"
libtest-mimic = "0.8"
libm = "0.2"
num-bigint = "0.4"
num-rational = { version = "0.4", default-features = false, features = ["num-bigint", "std"] }
num-traits = "0.2"

[profile.dev.package."*"]
opt-level = 2

# The oracle enumerates every path with exact fractions, and the sampled
# examples run hundreds of thousands of times: their tests would be slow
# unoptimized.
[profile.dev.package.probl-oracle]
opt-level = 2

[profile.dev.package.probl-engine]
opt-level = 1

[profile.release]
debug = 1
