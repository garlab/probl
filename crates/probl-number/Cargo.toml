[package]
name = "probl-number"
description = "Internal to Probl, with no stable API: exact integers shared by its syntax and runtime. Use the `probl` crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
# The tests and examples read the workspace's examples/ and benches/, which
# packages don't include: they run in the repository, not from crates.io.
exclude = ["tests/", "examples/"]

[dependencies]
num-bigint.workspace = true
num-rational.workspace = true
num-traits.workspace = true
rustc-hash.workspace = true

