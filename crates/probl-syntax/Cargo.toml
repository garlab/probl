[package]
name = "probl-syntax"
description = "Internal to Probl, with no stable API: its lexer, parser, AST and diagnostics. Use the `probl` crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
# The tests and examples read the workspace's examples/ and benches/, which
# packages don't include: they run in the repository, not from crates.io.
exclude = ["tests/", "examples/"]

[dependencies]
probl-number.workspace = true
ariadne.workspace = true

[dev-dependencies]
insta.workspace = true
