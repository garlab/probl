[package]
name = "probl-cli"
description = "The probl command-line tool"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
# The tests and examples read the workspace's examples/ and benches/, which
# packages don't include: they run in the repository, not from crates.io.
exclude = ["tests/", "examples/"]

[[bin]]
name = "probl"
path = "src/main.rs"

[dependencies]
probl.workspace = true
probl-syntax.workspace = true
probl-sema.workspace = true
probl-engine.workspace = true
clap.workspace = true

[dev-dependencies]
libtest-mimic.workspace = true

[[test]]
name = "examples"
harness = false
