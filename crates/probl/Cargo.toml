[package]
name = "probl"
description = "Compile and run Probl programs from Rust: a language where conditions are probabilities"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
# The tests and examples read the workspace's examples/ and benches/, which
# packages don't include: they run in the repository, not from crates.io.
exclude = ["tests/", "examples/"]

[dependencies]
probl-syntax.workspace = true
probl-sema.workspace = true
probl-engine.workspace = true
