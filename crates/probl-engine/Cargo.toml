[package]
name = "probl-engine"
description = "Internal to Probl, with no stable API: values, distributions and the world-set interpreter. Use the `probl` crate."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
# The tests and examples read the workspace's examples/ and benches/, which
# packages don't include: they run in the repository, not from crates.io.
exclude = ["tests/", "examples/"]

[dependencies]
probl-number.workspace = true
probl-syntax.workspace = true
probl-sema.workspace = true
rustc-hash.workspace = true
libm.workspace = true
csv.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
